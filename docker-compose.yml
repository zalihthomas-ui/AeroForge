version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://aeroforge:aeroforge@postgres:5432/aeroforge
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/workspace

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=aeroforge
      - POSTGRES_PASSWORD=aeroforge
      - POSTGRES_DB=aeroforge
    volumes:
      - aeroforge_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  aeroforge_postgres:
